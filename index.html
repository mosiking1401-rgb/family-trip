<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌊 سفر خانوادگی نوشهر | ۲۱ تا ۲۴ مهر</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;200;300;400;500;600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{
--g1:#065f46;--g2:#047857;--g3:#059669;--g4:#10b981;--g5:#d1fae5;--g6:#ecfdf5;
--b1:#0e7490;--b2:#0891b2;--b3:#06b6d4;--b4:#67e8f9;
--gold:#f59e0b;--gold2:#fbbf24;
--bg:#f0fdf4;--card:#fff;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;
}
body{font-family:'Vazirmatn',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* ===== HERO ===== */
.hero{
background:linear-gradient(160deg,#064e3b 0%,#065f46 20%,#047857 40%,#0e7490 70%,#0891b2 100%);
padding:40px 20px 70px;text-align:center;position:relative;overflow:hidden;
}
.hero::after{
content:'';position:absolute;bottom:-2px;left:0;width:100%;height:70px;
background:var(--bg);border-radius:50% 50% 0 0;
}
.hero-waves{position:absolute;bottom:40px;left:0;width:200%;height:50px;opacity:.15;animation:waveMove 6s linear infinite}
@keyframes waveMove{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.hero h1{color:#fff;font-size:30px;font-weight:900;margin:8px 0 4px;text-shadow:0 3px 20px rgba(0,0,0,.3)}
.hero p{color:rgba(255,255,255,.85);font-size:14px}
.hero-badge{
display:inline-flex;align-items:center;gap:8px;margin-top:12px;
background:rgba(255,255,255,.15);backdrop-filter:blur(10px);
border:1px solid rgba(255,255,255,.2);padding:8px 20px;border-radius:50px;
color:#fff;font-weight:700;font-size:13px;
}
.hero-emoji{font-size:56px;display:inline-block;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-10px) rotate(5deg)}}

/* ===== LOGIN ===== */
.login-wrap{max-width:540px;margin:-35px auto 30px;padding:0 16px;position:relative;z-index:10}
.login-box{
background:#fff;border-radius:26px;padding:28px 22px;
box-shadow:0 20px 60px rgba(6,95,70,.1),0 4px 12px rgba(0,0,0,.04);
border:1px solid rgba(6,95,70,.06);
}
.login-box h2{text-align:center;font-size:20px;font-weight:900;color:var(--g1);margin-bottom:4px}
.login-box .sub{text-align:center;color:var(--muted);font-size:12px;margin-bottom:20px}
.grp-label{font-size:11px;font-weight:800;color:var(--g3);margin:14px 0 8px;display:flex;align-items:center;justify-content:space-between}
.m-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.m-btn{
display:flex;flex-direction:column;align-items:center;gap:4px;
padding:12px 6px;border:2px solid var(--border);border-radius:14px;
background:#fff;cursor:pointer;transition:all .25s;font-family:'Vazirmatn';
font-size:12px;font-weight:700;color:var(--text);position:relative;
}
.m-btn:hover{border-color:var(--g3);background:var(--g6);transform:translateY(-2px)}
.m-btn.sel{border-color:var(--g3);background:linear-gradient(135deg,var(--g6),#ccfbf1);box-shadow:0 6px 16px rgba(5,150,105,.15)}
.m-btn .av{font-size:28px}
.go-btn{
width:100%;padding:15px;border:none;border-radius:15px;margin-top:16px;
background:linear-gradient(135deg,var(--g2),var(--b1));color:#fff;
font-family:'Vazirmatn';font-size:16px;font-weight:900;cursor:pointer;
transition:all .3s;
}
.go-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 10px 25px rgba(6,95,70,.3)}
.go-btn:disabled{background:#cbd5e1;cursor:not-allowed}

.add-member-trigger{
width:100%;padding:10px;border:2px dashed var(--g3);border-radius:12px;
background:var(--g6);color:var(--g2);font-family:'Vazirmatn';font-size:12px;
font-weight:800;cursor:pointer;margin-top:14px;transition:all .2s;
display:flex;align-items:center;justify-content:center;gap:6px;
}
.add-member-trigger:hover{background:#ccfbf1;border-color:var(--g2)}

/* ===== MODAL ===== */
.modal-overlay{
position:fixed;top:0;left:0;width:100%;height:100%;
background:rgba(0,0,0,.5);backdrop-filter:blur(5px);
display:none;align-items:center;justify-content:center;z-index:99999;padding:16px;
}
.modal-overlay.active{display:flex}
.modal-box{
background:#fff;border-radius:24px;padding:26px;width:100%;max-width:420px;
box-shadow:0 25px 50px -12px rgba(0,0,0,.25);animation:popIn .3s ease;
}
@keyframes popIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.modal-box h3{font-size:18px;font-weight:900;color:var(--g1);margin-bottom:14px}
.modal-form{display:flex;flex-direction:column;gap:12px}
.modal-form label{font-size:12px;font-weight:700;color:var(--muted)}
.modal-form input, .modal-form select{
padding:12px;border:2px solid var(--border);border-radius:12px;
font-family:'Vazirmatn';font-size:13px;outline:none;
}
.modal-form input:focus, .modal-form select:focus{border-color:var(--g3)}
.modal-btns{display:flex;gap:8px;margin-top:8px}
.modal-btn{
flex:1;padding:12px;border:none;border-radius:12px;font-family:'Vazirmatn';
font-size:13px;font-weight:800;cursor:pointer;
}
.modal-btn.save{background:var(--g3);color:#fff}
.modal-btn.cancel{background:#f1f5f9;color:var(--muted)}

/* ===== APP ===== */
.app{display:none;max-width:860px;margin:0 auto;padding:0 16px 120px;position:relative;z-index:1}
.ubar{
margin:-35px 0 20px;padding:14px 18px;background:#fff;border-radius:20px;
box-shadow:0 8px 25px rgba(0,0,0,.06);display:flex;align-items:center;justify-content:space-between;
border:1px solid rgba(6,95,70,.06);
}
.ubar-info{display:flex;align-items:center;gap:10px}
.ubar-av{
width:42px;height:42px;border-radius:12px;
background:linear-gradient(135deg,var(--g3),var(--b2));
display:flex;align-items:center;justify-content:center;font-size:22px;
}
.ubar-name{font-weight:800;font-size:14px}
.ubar-role{font-size:11px;color:var(--muted)}
.out-btn{
padding:7px 14px;border:2px solid #fecdd3;border-radius:10px;
background:#fff1f2;color:#ef4444;font-family:'Vazirmatn';font-size:11px;
font-weight:700;cursor:pointer;
}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.st{
background:#fff;border-radius:16px;padding:14px 8px;text-align:center;
box-shadow:0 4px 14px rgba(0,0,0,.04);border:1px solid rgba(6,95,70,.05);position:relative;overflow:hidden;
}
.st::before{content:'';position:absolute;top:0;right:0;width:100%;height:3px}
.st:nth-child(1)::before{background:linear-gradient(90deg,var(--g3),var(--b3))}
.st:nth-child(2)::before{background:linear-gradient(90deg,var(--b2),var(--b4))}
.st:nth-child(3)::before{background:linear-gradient(90deg,var(--gold),var(--gold2))}
.st-i{font-size:22px;margin-bottom:4px}
.st-v{font-size:22px;font-weight:900;color:var(--g1)}
.st-l{font-size:10px;color:var(--muted);font-weight:600}

/* Tabs */
.tabs-wrap{position:sticky;top:0;z-index:100;margin-bottom:18px}
.tabs{
display:flex;gap:4px;padding:4px;background:#fff;border-radius:16px;
box-shadow:0 4px 16px rgba(0,0,0,.06);overflow-x:auto;border:1px solid rgba(6,95,70,.05);
}
.tabs::-webkit-scrollbar{display:none}
.tb{
flex:1;min-width:max-content;padding:10px 8px;border:none;border-radius:12px;
background:transparent;font-family:'Vazirmatn';font-size:12px;font-weight:700;
color:var(--muted);cursor:pointer;white-space:nowrap;transition:all .2s;
}
.tb.on{background:linear-gradient(135deg,var(--g2),var(--b1));color:#fff;box-shadow:0 4px 12px rgba(6,95,70,.2)}

.tc{display:none}
.tc.on{display:block;animation:fadeUp .3s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* Day & Meals */
.dh{
display:flex;align-items:center;gap:12px;margin-bottom:14px;
padding:14px 18px;background:linear-gradient(135deg,var(--g6),#ccfbf1);
border-radius:16px;border-right:4px solid var(--g3);
}
.dh-num{
width:38px;height:38px;border-radius:10px;
background:linear-gradient(135deg,var(--g2),var(--b1));
color:#fff;display:flex;align-items:center;justify-content:center;
font-size:16px;font-weight:900;flex-shrink:0;
}
.dh h3{font-size:15px;font-weight:800}
.dh span{font-size:11px;color:var(--muted)}

.mc{
background:#fff;border-radius:18px;padding:18px;margin-bottom:14px;
box-shadow:0 4px 14px rgba(0,0,0,.04);border:1px solid rgba(6,95,70,.04);
}
.mc-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.mc-icon{
width:40px;height:40px;border-radius:10px;display:flex;align-items:center;
justify-content:center;font-size:20px;flex-shrink:0;
}
.mc-icon.bk{background:linear-gradient(135deg,#fef3c7,#fde68a)}
.mc-icon.lu{background:linear-gradient(135deg,#fce7f3,#fbcfe8)}
.mc-icon.di{background:linear-gradient(135deg,#dbeafe,#bfdbfe)}
.mc-icon.sn{background:linear-gradient(135deg,#d1fae5,#a7f3d0)}
.mc-title{font-weight:800;font-size:14px}
.mc-time{font-size:10px;color:var(--muted)}

.fo{
display:flex;align-items:center;gap:10px;padding:10px 12px;
border:2px solid #f1f5f9;border-radius:12px;cursor:pointer;
transition:all .2s;position:relative;overflow:hidden;background:#fff;margin-bottom:6px;
}
.fo::after{
content:'';position:absolute;bottom:0;left:0;height:3px;
width:var(--pct,0%);background:linear-gradient(90deg,var(--g3),var(--b3));
transition:width .4s;border-radius:0 3px 3px 0;
}
.fo:hover{border-color:var(--g4);transform:translateX(-2px)}
.fo.voted{border-color:var(--g3);background:linear-gradient(135deg,#f0fdf4,#ecfdf5)}
.fo.winner{border-color:var(--gold);background:linear-gradient(135deg,#fffbeb,#fef3c7)}
.fo.winner::after{background:linear-gradient(90deg,var(--gold),var(--gold2))}
.fo-em{font-size:26px;flex-shrink:0}
.fo-info{flex:1;min-width:0}
.fo-name{font-weight:700;font-size:13px}
.fo-desc{font-size:10px;color:var(--muted);margin-top:1px}
.fo-voters{display:flex;gap:2px;flex-wrap:wrap;margin-top:4px}
.vc{
width:20px;height:20px;border-radius:6px;background:rgba(5,150,105,.1);
display:inline-flex;align-items:center;justify-content:center;font-size:11px;
}
.fo-count{text-align:center;flex-shrink:0;min-width:40px}
.fo-num{font-size:16px;font-weight:900;color:var(--g2)}
.fo.winner .fo-num{color:var(--gold)}
.fo-lbl{font-size:9px;color:var(--muted);font-weight:600}
.w-badge{
display:none;padding:2px 6px;background:linear-gradient(135deg,var(--gold),#d97706);
color:#fff;border-radius:5px;font-size:9px;font-weight:800;flex-shrink:0;
}
.fo.winner .w-badge{display:flex;align-items:center;gap:2px}

.add-row{display:flex;gap:6px;margin-top:8px}
.add-row input{
flex:1;padding:8px 12px;border:2px solid var(--border);border-radius:10px;
font-family:'Vazirmatn';font-size:12px;outline:none;
}
.add-row input:focus{border-color:var(--g3)}
.add-row button{
padding:8px 14px;border:none;border-radius:10px;
background:linear-gradient(135deg,var(--g3),var(--g2));color:#fff;
font-family:'Vazirmatn';font-size:11px;font-weight:700;cursor:pointer;
}

/* Activities */
.act-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.ac{
background:#fff;border-radius:16px;padding:16px;cursor:pointer;
transition:all .2s;border:2px solid transparent;box-shadow:0 4px 14px rgba(0,0,0,.04);
}
.ac:hover{transform:translateY(-3px);border-color:var(--g4)}
.ac.voted{border-color:var(--b3);background:linear-gradient(135deg,#ecfeff,#e0f7ff)}
.ac.winner{border-color:var(--gold);background:linear-gradient(135deg,#fffbeb,#fef3c7)}
.ac-top{display:flex;gap:10px;margin-bottom:8px}
.ac-em{font-size:32px;flex-shrink:0}
.ac-name{font-weight:800;font-size:13px}
.ac-desc{font-size:10px;color:var(--muted);line-height:1.6;margin-top:2px}
.ac-bot{display:flex;align-items:center;justify-content:space-between;padding-top:8px;border-top:1px solid var(--border)}
.ac-voters{display:flex;gap:2px;flex-wrap:wrap}
.ac-cnt{font-size:15px;font-weight:900;color:var(--g2)}

/* Places */
.pl{
display:flex;gap:12px;padding:16px;background:#fff;border-radius:16px;
margin-bottom:10px;box-shadow:0 4px 14px rgba(0,0,0,.04);
}
.pl-img{
width:64px;height:64px;border-radius:12px;
background:linear-gradient(135deg,var(--g6),#ccfbf1);
display:flex;align-items:center;justify-content:center;font-size:32px;flex-shrink:0;
}
.pl-name{font-weight:800;font-size:14px;margin-bottom:2px}
.pl-desc{font-size:11px;color:var(--muted);line-height:1.7}
.pl-tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:9px;font-weight:700;margin-top:4px;margin-left:3px}
.t-n{background:#d1fae5;color:#065f46}
.t-b{background:#e0f2fe;color:#0c4a6e}
.t-f{background:#fef3c7;color:#92400e}
.t-s{background:#fce7f3;color:#9d174d}
.t-h{background:#ede9fe;color:#5b21b6}

/* Results */
.ri{
display:flex;align-items:center;gap:10px;padding:12px 14px;
background:#fff;border-radius:14px;margin-bottom:6px;box-shadow:0 3px 10px rgba(0,0,0,.03);
}
.ri-em{font-size:24px;flex-shrink:0}
.ri-info{flex:1}
.ri-type{font-size:10px;color:var(--muted);font-weight:600}
.ri-name{font-weight:800;font-size:13px}
.ri-votes{
padding:4px 10px;background:linear-gradient(135deg,#ecfdf5,#d1fae5);
border-radius:6px;font-size:11px;font-weight:800;color:#059669;flex-shrink:0;
}
.no-r{color:var(--muted);font-size:11px;font-style:italic}

/* Sync Box */
.sync-box{
background:#fff;border-radius:20px;padding:24px 20px;margin-bottom:16px;
box-shadow:0 4px 20px rgba(0,0,0,.04);border:2px dashed var(--g4);text-align:center;
}
.sync-box h3{font-size:16px;font-weight:800;color:var(--g1);margin-bottom:6px}
.sync-box p{font-size:12px;color:var(--muted);line-height:1.9;margin-bottom:14px}
.sync-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.sync-btn{
padding:12px 20px;border:none;border-radius:12px;
font-family:'Vazirmatn';font-size:13px;font-weight:800;cursor:pointer;
transition:all .2s;display:flex;align-items:center;gap:6px;
}
.sync-btn:hover{transform:translateY(-2px)}
.sync-btn.dl{background:linear-gradient(135deg,var(--g3),var(--g2));color:#fff}
.sync-btn.ul{background:linear-gradient(135deg,var(--b2),var(--b1));color:#fff}
.sync-btn.pr{background:linear-gradient(135deg,var(--gold),#d97706);color:#fff}
.sync-btn.rst{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff}

.upload-zone{
margin-top:14px;padding:24px;border:2px dashed var(--border);border-radius:14px;
background:var(--g6);cursor:pointer;
}
.file-list{margin-top:10px;text-align:right}
.file-item{
display:flex;align-items:center;gap:8px;padding:8px 12px;
background:#fff;border-radius:10px;margin-bottom:4px;border:1px solid var(--border);font-size:12px;
}
.file-item .fi-name{flex:1;font-weight:700}
.file-item .fi-status{color:var(--g3);font-weight:700}
.file-item .fi-del{
padding:3px 8px;border:none;border-radius:6px;background:#fee2e2;
color:#ef4444;font-family:'Vazirmatn';font-size:10px;font-weight:700;cursor:pointer;
}

/* Notification */
.notif{
position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-120px);
padding:12px 20px;border-radius:14px;z-index:100000;
transition:transform .4s cubic-bezier(.34,1.56,.64,1);
font-weight:700;font-size:12px;display:flex;align-items:center;gap:8px;
max-width:90%;backdrop-filter:blur(20px);
}
.notif.show{transform:translateX(-50%) translateY(0)}
.notif.ok{background:rgba(236,253,245,.95);border:2px solid #a7f3d0;color:#065f46}
.notif.info{background:rgba(224,242,254,.95);border:2px solid #7dd3fc;color:#0c4a6e}

@media(max-width:520px){
.hero h1{font-size:22px}
.m-grid{grid-template-columns:repeat(2,1fr)}
.tb{font-size:10px;padding:8px 4px}
.sync-btns{flex-direction:column}
.sync-btn{justify-content:center}
}
</style>
</head>
<body>

<div class="notif" id="notif"><span id="nI">✅</span><span id="nT"></span></div>

<!-- HERO -->
<div class="hero">
<svg class="hero-waves" viewBox="0 0 1200 60" preserveAspectRatio="none">
<path d="M0,30 C200,60 400,0 600,30 C800,60 1000,0 1200,30 L1200,60 L0,60Z" fill="rgba(255,255,255,.3)"/>
<path d="M0,30 C200,0 400,60 600,30 C800,0 1000,60 1200,30 L1200,60 L0,60Z" fill="rgba(255,255,255,.2)"/>
</svg>
<div style="position:relative;z-index:2">
<div class="hero-emoji">🌊</div>
<h1>سفر خانوادگی نوشهر</h1>
<p>همه با هم برای هر وعده و تفریح رأی می‌دهیم</p>
<div class="hero-badge">📅 ۲۱ تا ۲۴ مهر ۱۴۰۴</div>
</div>
</div>

<!-- LOGIN SCREEN -->
<div class="login-wrap" id="loginWrap">
<div class="login-box">
<h2>🌿 به سفر خوش آمدید!</h2>
<p class="sub">اسم خود را انتخاب کنید</p>

<div class="grp-label"><span>👨‍👩‍👧 والدین</span></div>
<div class="m-grid" id="gParents"></div>

<div class="grp-label" style="margin-top:16px"><span>💫 فرزندان و همراهان</span></div>
<div class="m-grid" id="gChildren"></div>

<button class="add-member-trigger" onclick="openAddMemberModal()">
➕ افزودن عضو جدید به خانواده
</button>

<button class="go-btn" id="goBtn" disabled onclick="login()">🚀 ورود به رأی‌گیری</button>
</div>
</div>

<!-- APP -->
<div class="app" id="app">
<div class="ubar">
<div class="ubar-info">
<div class="ubar-av" id="uAv">👤</div>
<div><div class="ubar-name" id="uName"></div><div class="ubar-role" id="uRole"></div></div>
</div>
<button class="out-btn" onclick="logout()">🚪 خروج</button>
</div>

<div class="stats">
<div class="st"><div class="st-i">👨‍👩‍👧‍👦</div><div class="st-v" id="sM">0</div><div class="st-l">اعضا</div></div>
<div class="st"><div class="st-i">🗳️</div><div class="st-v" id="sV">0</div><div class="st-l">رأی ثبت شده</div></div>
<div class="st"><div class="st-i">✅</div><div class="st-v" id="sD">0</div><div class="st-l">وعده تعیین‌شده</div></div>
</div>

<div class="tabs-wrap">
<div class="tabs">
<button class="tb on" onclick="goTab('food',this)">🍽️ غذا</button>
<button class="tb" onclick="goTab('act',this)">🎢 تفریح</button>
<button class="tb" onclick="goTab('place',this)">📍 جاذبه</button>
<button class="tb" onclick="goTab('sync',this)">📤 ارسال رأی</button>
<button class="tb" onclick="goTab('result',this)">📊 نتایج</button>
</div>
</div>

<div class="tc on" id="t-food"></div>
<div class="tc" id="t-act"></div>
<div class="tc" id="t-place"></div>
<div class="tc" id="t-sync"></div>
<div class="tc" id="t-result"></div>
</div>

<!-- MODAL ADD MEMBER -->
<div class="modal-overlay" id="addMemberModal">
<div class="modal-box">
<h3>➕ افزودن عضو جدید</h3>
<div class="modal-form">
<div>
<label>نام و نام خانوادگی:</label>
<input type="text" id="newMemberName" placeholder="مثلاً: علیرضا، خاله سارا..." />
</div>
<div>
<label>نقش / عنوان:</label>
<input type="text" id="newMemberRole" placeholder="مثلاً: فرزند، مهمان ویژه..." />
</div>
<div>

// ===== VOTING =====
function vk(d,m,f){return d+'_'+m+'_'+f}
function mk(d,m){return d+'_'+m}

function vote(dayId,mealId,foodId){
if(!CU)return;
const k=mk(dayId,mealId);
const all=[...(FOODS[mealId]||[]),...(customFoods[k]||[])];
all.forEach(f=>{ delete myVotes[vk(dayId,mealId,f.id)]; });
myVotes[vk(dayId,mealId,foodId)]=true;
saveLocal(); renderFood(); updateStats();
const food=all.find(f=>f.id===foodId);
notify(`رأی شما به «${food?.name}» ثبت شد! ✅`,'ok');
}

function voteAct(actId){
if(!CU)return;
const k='act_'+actId;
if(myVotes[k]){delete myVotes[k]; notify('رأی حذف شد ❌','info');}
else{myVotes[k]=true; const a=ACTS.find(x=>x.id===actId); notify(`رأی به «${a?.name}» ثبت شد! ✅`,'ok');}
saveLocal(); renderAct(); updateStats();
}

function getFoodVoteCount(dayId,mealId,foodId){
const k=vk(dayId,mealId,foodId);
let count=0;
Object.values(allVotes).forEach(uv=>{ if(uv[k]) count++; });
if(myVotes[k] && !allVotes[CU.id]?.[k]) count++;
return count;
}

function getActVoteCount(actId){
const k='act_'+actId;
let count=0;
Object.values(allVotes).forEach(uv=>{ if(uv[k]) count++; });
if(myVotes[k] && !allVotes[CU.id]?.[k]) count++;
return count;
}

function getVotersForFood(dayId,mealId,foodId){
const k=vk(dayId,mealId,foodId);
let voters=[];
Object.entries(allVotes).forEach(([uid,uv])=>{ if(uv[k]){const m=M.find(x=>x.id===uid);if(m)voters.push(m.em);}});
if(myVotes[k] && !allVotes[CU.id]?.[k]) voters.push(CU.em);
return voters;
}

function getVotersForAct(actId){
const k='act_'+actId;
let voters=[];
Object.entries(allVotes).forEach(([uid,uv])=>{ if(uv[k]){const m=M.find(x=>x.id===uid);if(m)voters.push(m.em);}});
if(myVotes[k] && !allVotes[CU.id]?.[k]) voters.push(CU.em);
return voters;
}

function getWinner(dayId,mealId){
const k=mk(dayId,mealId);
const all=[...(FOODS[mealId]||[]),...(customFoods[k]||[])];
let max=0,w=null;
all.forEach(f=>{
const c=getFoodVoteCount(dayId,mealId,f.id);
if(c>max){max=c;w={...f,vc:c};}
});
return max>=1?w:null;
}

// ===== RENDER FOOD =====
function renderFood(){
const el=document.getElementById('t-food');
let h='';
DAYS.forEach(day=>{
h+=`<div style="margin-bottom:24px">
<div class="dh"><div class="dh-num">${day.n}</div><div><h3>${day.name}</h3><span>${day.date}</span></div></div>`;
MEALS.forEach(meal=>{
const k=mk(day.id,meal.id);
const all=[...(FOODS[meal.id]||[]),...(customFoods[k]||[])];
const winner=getWinner(day.id,meal.id);
h+=`<div class="mc"><div class="mc-head">
<div class="mc-icon ${meal.css}">${meal.em}</div>
<div><div class="mc-title">${meal.name}</div><div class="mc-time">${meal.time} • ${day.date}</div></div>
</div>`;
all.forEach(food=>{
const cnt=getFoodVoteCount(day.id,meal.id,food.id);
const voters=getVotersForFood(day.id,meal.id,food.id);
const isVoted=myVotes[vk(day.id,meal.id,food.id)];
const isW=winner&&winner.id===food.id;
const pct=(cnt/M.length*100);
const vhtml=voters.map(e=>`<span class="vc">${e}</span>`).join('');
h+=`<div class="fo ${isVoted?'voted':''} ${isW?'winner':''}" style="--pct:${pct}%" onclick="vote('${day.id}','${meal.id}','${food.id}')">
<span class="fo-em">${food.em}</span>
<div class="fo-info"><div class="fo-name">${food.name}</div><div class="fo-desc">${food.d}</div>
${voters.length?`<div class="fo-voters">${vhtml}</div>`:''}</div>
<div class="fo-count"><div class="fo-num">${cnt}</div><div class="fo-lbl">رأی</div></div>
<div class="w-badge">👑 برنده</div></div>`;
});
h+=`<div class="add-row"><input id="ci-${day.id}-${meal.id}" placeholder="پیشنهاد غذای جدید..."/>
<button onclick="addFood('${day.id}','${meal.id}')">➕ اضافه</button></div></div>`;
});
h+='</div>';
});
el.innerHTML=h;
}

function addFood(d,m){
const inp=document.getElementById('ci-'+d+'-'+m);
const n=inp.value.trim();if(!n)return;
const k=mk(d,m);if(!customFoods[k])customFoods[k]=[];
customFoods[k].push({id:'c'+Date.now(),name:n,em:'🍴',d:'پیشنهاد '+CU.name});
inp.value='';saveLocal();renderFood();notify(`«${n}» اضافه شد!`,'ok');
}

// ===== RENDER ACT =====
function renderAct(){
const el=document.getElementById('t-act');
const maxV=Math.max(...ACTS.map(a=>getActVoteCount(a.id)),0);
const sorted=[...ACTS].sort((a,b)=>getActVoteCount(b.id)-getActVoteCount(a.id));
let h=`<div class="dh"><div class="dh-num">🎢</div><div><h3>تفریحات سفر</h3><span>رأی دهید! (کلیک دوباره = حذف)</span></div></div><div class="act-grid">`;
sorted.forEach(a=>{
const cnt=getActVoteCount(a.id);
const voters=getVotersForAct(a.id);
const isV=myVotes['act_'+a.id];
const isW=cnt>0&&cnt===maxV;
const vhtml=voters.map(e=>`<span class="vc">${e}</span>`).join('');
h+=`<div class="ac ${isV?'voted':''} ${isW?'winner':''}" onclick="voteAct('${a.id}')">
<div class="ac-top"><span class="ac-em">${a.em}</span><div>
<div class="ac-name">${a.name} ${isW?'👑':''}</div><div class="ac-desc">${a.d}</div></div></div>
<div class="ac-bot"><div class="ac-voters">${vhtml||'<span style="font-size:10px;color:var(--muted)">هنوز رأیی نیست</span>'}</div>
<div class="ac-cnt">${cnt} رأی</div></div></div>`;
});
h+='</div>';el.innerHTML=h;
}

<p>بعد از اتمام رأی‌گیری، فایل را دانلود کنید و در واتساپ یا تلگرام برای <b>مرتضی</b> (مدیر سفر) بفرستید.<br>
شما تا الان <b>${voteCount}</b> رأی ثبت کرده‌اید.</p>
<div class="sync-btns">
<button class="sync-btn dl" onclick="downloadMyVotes()">📥 دانلود فایل رأی من (${CU.name})</button>
</div></div>`;

if(isAdmin){
h+=`<div class="sync-box" style="border-color:var(--b3)">
<h3>📤 مرحله ۲: بارگذاری رأی اعضا (مخصوص مدیر)</h3>
<p>فایل‌های JSON ارسالی اعضا را اینجا بارگذاری کنید تا نتایج نهایی بلافاصله محاسبه شوند.</p>
<div class="sync-btns">
<button class="sync-btn ul" onclick="document.getElementById('fileInput').click()">📤 انتخاب فایل‌ها از گوشی/کامپیوتر</button>
<button class="sync-btn pr" onclick="printResults()">🖨️ پرینت / خروجی PDF نتایج</button>
<button class="sync-btn rst" onclick="resetAll()">🗑️ پاک کردن همه</button>
</div>
<div class="upload-zone" id="dropZone" onclick="document.getElementById('fileInput').click()"
ondragover="event.preventDefault();"
ondrop="event.preventDefault();handleFiles(event.dataTransfer.files)">
<div style="font-size:36px;margin-bottom:6px">📁</div>
<div style="font-weight:700;color:var(--g1);font-size:13px">کلیک کنید یا فایل‌ها را اینجا رها کنید</div>
</div>`;

if(uploadedFiles.length>0){
h+=`<div class="file-list"><h4 style="margin:12px 0 6px;font-size:13px">📋 اعضایی که رأی‌شان بارگذاری شده (${uploadedFiles.length} نفر):</h4>`;
uploadedFiles.forEach((f,i)=>{
const m=M.find(x=>x.id===f.memberId);
h+=`<div class="file-item"><span>${m?.em||'👤'}</span>
<span class="fi-name">${m?.name||f.memberId}</span>
<span class="fi-status">✅ ${Object.keys(f.votes).length} رأی</span>
<button class="fi-del" onclick="removeFile(${i})">حذف</button></div>`;
});
h+='</div>';
}
h+='</div>';
} else {
h+=`<div class="sync-box" style="border-color:var(--gold);background:linear-gradient(135deg,#fffbeb,#fef3c7)">
<h3>ℹ️ راهنمایی برای اعضا</h3>
<p>فایل رأی خود را از دکمه بالا دانلود کرده و برای <b>مرتضی</b> ارسال کنید.<br>
پس از بارگذاری تمام آرا، نتایج نهایی در تب «📊 نتایج» نمایش داده می‌شود.</p></div>`;
}

el.innerHTML=h;
}

function downloadMyVotes(){
if(!CU)return;
const data={
memberId:CU.id,
memberName:CU.name,
votes:myVotes,
timestamp:new Date().toISOString(),
trip:'سفر نوشهر ۲۱ تا ۲۴ مهر ۱۴۰۴'
};
const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
const url=URL.createObjectURL(blob);
const a=document.createElement('a');
a.href=url;
a.download=`vote_${CU.name}.json`;
a.click();
URL.revokeObjectURL(url);
notify('فایل رأی شما با موفقیت دانلود شد! 📥','ok');
}

function handleFiles(files){
if(!CU?.admin)return;
Array.from(files).forEach(file=>{
if(!file.name.endsWith('.json'))return;
const reader=new FileReader();
reader.onload=function(e){
try{
const data=JSON.parse(e.target.result);
if(!data.memberId||!data.votes){notify('فایل نامعتبر است! ❌','info');return;}

// If this member was added dynamically, ensure they exist in M
if(!M.some(m => m.id === data.memberId)){
M.push({ id: data.memberId, name: data.memberName || 'عضو جدید', em: '👤', role: 'عضو خانواده', g: 'c' });
}

const idx=uploadedFiles.findIndex(f=>f.memberId===data.memberId);
if(idx>=0) uploadedFiles[idx]=data;
else uploadedFiles.push(data);

allVotes[data.memberId]=data.votes;
saveLocal();
renderSync();renderAll();
const m=M.find(x=>x.id===data.memberId);
notify(`رأی‌های ${m?.name||data.memberId} بارگذاری شد! ✅`,'ok');
}catch(err){notify('خطا در خواندن فایل! ❌','info');}
};
reader.readAsText(file);
});
}

function removeFile(idx){
const f=uploadedFiles[idx];
if(f){delete allVotes[f.memberId];}
uploadedFiles.splice(idx,1);
saveLocal();renderSync();renderAll();
notify('فایل حذف شد','info');
}

function resetAll(){
if(!confirm('همه اطلاعات و رأی‌های بارگذاری شده پاک شوند؟'))return;
allVotes={};uploadedFiles=[];myVotes={};
saveLocal();renderAll();renderSync();
notify('همه داده‌ها پاک شد! 🗑️','info');
}

function printResults(){
let t=`🏖️ نتایج برنامه و وعده‌های سفر نوشهر\n📅 ۲۱ تا ۲۴ مهر ۱۴۰۴\n${'═'.repeat(35)}\n\n`;
DAYS.forEach(day=>{
t+=`📅 ${day.name} (${day.date})\n${'─'.repeat(25)}\n`;
MEALS.forEach(meal=>{
const w=getWinner(day.id,meal.id);
t+=`  ${meal.em} ${meal.name}: ${w?`${w.name} (${w.vc} رأی) 👑`:'تعیین نشده'}\n`;
});
t+='\n';
});
t+=`🎢 تفریحات برتر انتخابی خانواده:\n${'─'.repeat(25)}\n`;
[...ACTS].sort((a,b)=>getActVoteCount(b.id)-getActVoteCount(a.id)).slice(0,6).forEach((a,i)=>{
const c=getActVoteCount(a.id);if(c>0)t+=`  ${['🥇','🥈','🥉','4','5','6'][i]}. ${a.em} ${a.name}: ${c} رأی\n`;
});

const w=window.open('','_blank');
w.document.write(`<html dir="rtl"><head><meta charset="utf-8"><title>نتایج نهایی سفر نوشهر</title>
<style>body{font-family:Vazirmatn,Tahoma,sans-serif;padding:30px;direction:rtl;white-space:pre-wrap;font-size:15px;line-height:2}
h1{color:#065f46;text-align:center}</style></head><body><h1>🏖️ نتایج نهایی سفر نوشهر</h1>${t.replace(/\n/g,'<br>')}</body></html>`);
w.document.close();
w.print();
}

// ===== RENDER RESULT =====

const el=document.getElementById('t-result');
let h=`<div class="dh"><div class="dh-num">📊</div><div><h3>نتایج نهایی آرا</h3><span>محاسبه شده از روی تمام فایل‌های ارسالی</span></div></div>`;
DAYS.forEach(day=>{
h+=`<div style="margin-bottom:20px"><div style="font-size:15px;font-weight:900;color:var(--g1);margin-bottom:10px">📅 ${day.name} — ${day.date}</div>`;
MEALS.forEach(meal=>{
const w=getWinner(day.id,meal.id);
h+=`<div class="ri"><span class="ri-em">${meal.em}</span><div class="ri-info">
<div class="ri-type">${meal.name}</div>
${w?`<div class="ri-name">${w.em} ${w.name}</div>`:'<div class="no-r">هنوز رأیی بارگذاری نشده</div>'}
</div>${w?`<div class="ri-votes">👑 ${w.vc} رأی</div>`:''}</div>`;
});
h+='</div>';
});
h+=`<div style="margin-bottom:20px"><div style="font-size:15px;font-weight:900;color:var(--g1);margin-bottom:10px">🎢 تفریحات برگزیده</div>`;
const sorted=[...ACTS].sort((a,b)=>getActVoteCount(b.id)-getActVoteCount(a.id)).slice(0,6);
const medals=['🥇','🥈','🥉','4️⃣','5️⃣','6️⃣'];
sorted.forEach((a,i)=>{
const c=getActVoteCount(a.id);
if(c>0) h+=`<div class="ri"><span class="ri-em">${medals[i]}</span><div class="ri-info">
<div class="ri-type">${a.em} ${a.name}</div><div class="ri-name">${a.d}</div>
</div><div class="ri-votes">👥 ${c} رأی</div></div>`;
});
h+='</div>';
el.innerHTML=h;
}

// ===== STATS =====
function updateStats(){
document.getElementById('sM').textContent=M.length;
let tv=0;
Object.values(allVotes).forEach(uv=>{tv+=Object.keys(uv).length});
tv+=Object.keys(myVotes).filter(k=>!allVotes[CU?.id]?.[k]).length;
document.getElementById('sV').textContent=tv;
let dc=0;
DAYS.forEach(d=>{MEALS.forEach(m=>{if(getWinner(d.id,m.id))dc++})});
document.getElementById('sD').textContent=dc;
}

// ===== NOTIFICATION =====
function notify(text,type='ok'){
const n=document.getElementById('notif');
document.getElementById('nI').textContent=type==='ok'?'✅':'ℹ️';
document.getElementById('nT').textContent=text;
n.className=`notif ${type} show`;
setTimeout(()=>n.classList.remove('show'),3200);
}

// ===== RENDER ALL =====
function renderAll(){renderFood();renderAct();renderPlace();renderResult();renderSync();updateStats();}

// ===== INIT =====
loadLocal();
renderLogin();
</script>
